[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "powermanager-core"
version = "0.1.0"
description = "Local, backend-agnostic home battery monitoring and control core"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "PowerManager contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
sma = [
    "pymodbus==3.13.1",
]
rules = ["PyYAML>=6.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "PyYAML>=6.0",
    "pytest-homeassistant-custom-component>=0.13",
]

[project.scripts]
powermanager = "powermanager_core.cli:main"

[tool.setuptools]
package-dir = {"" = "custom_components/powermanager/core"}

[tool.setuptools.packages.find]
where = ["custom_components/powermanager/core"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/homeassistant"]
pythonpath = ["custom_components/powermanager/core", "."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
