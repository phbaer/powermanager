# PowerManager control policy example.
# This file is intentionally disabled; simulation requires --enabled explicitly.
version: 1
enabled: false

rules:
  # Charge when the grid is exporting surplus energy and the battery has room.
  - id: charge-solar-surplus
    priority: 100
    when:
      grid_power_below_w: -500
      battery_soc_below_percent: 90
      between: ["09:00", "16:00"]
    then:
      target_power_w: 1500
    hold_seconds: 300

  # A lower-priority daytime rule keeps a smaller charge target near the SoC limit.
  - id: charge-small-surplus
    priority: 50
    when:
      grid_power_below_w: -200
      battery_soc_below_percent: 98
      between: ["08:00", "18:00"]
    then:
      target_power_w: 500
    hold_seconds: 300

  # Discharge during import peaks only while the battery is well above reserve.
  - id: discharge-import-peak
    priority: 20
    when:
      grid_power_above_w: 2000
      battery_soc_above_percent: 40
      between: ["18:00", "22:00"]
    then:
      target_power_w: -1000
    hold_seconds: 600

  # Dynamic-tariff example: charge when the market price is below 0.20 per kWh.
  - id: charge-cheap-market
    priority: 80
    when:
      price_below_per_kwh: 0.20
      battery_soc_below_percent: 85
    then:
      target_power_w: 1000
    hold_seconds: 900
