name: HACS integration

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "custom_components/powermanager/**"
      - "hacs.json"
  pull_request:
    paths:
      - "custom_components/powermanager/**"
      - "hacs.json"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to package"
        required: true
        type: string
      tag:
        description: "Unique release tag to publish"
        required: true
        type: string

permissions:
  contents: write

env:
  INTEGRATION_PATH: custom_components/powermanager
  RELEASE_ARCHIVE: powermanager.zip

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Check integration layout
        run: |
          test -f "$INTEGRATION_PATH/manifest.json"
          test -f "$INTEGRATION_PATH/strings.json"
          test -f "$INTEGRATION_PATH/translations/en.json"
          python -m json.tool "$INTEGRATION_PATH/manifest.json" >/dev/null
          python -m json.tool "$INTEGRATION_PATH/strings.json" >/dev/null
          python -m json.tool "$INTEGRATION_PATH/translations/en.json" >/dev/null
      - uses: hacs/action@main
        with:
          category: integration
          # GitHub repository metadata is managed outside the checkout.
          ignore: brands images license topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - run: uv sync --locked --extra sma --extra dev
      - run: uv run pytest
      - run: uv run ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: home-assistant/actions/hassfest@master

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [validate, tests, hassfest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Package integration
        run: zip -r "$RELEASE_ARCHIVE" "$INTEGRATION_PATH"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: ${{ env.RELEASE_ARCHIVE }}
