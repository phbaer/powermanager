name: Home Assistant validation

on:
  push:
    branches: ["**"]
    paths:
      - "custom_components/powermanager/**"
      - ".github/workflows/hassfest.yml"
  pull_request:
    paths:
      - "custom_components/powermanager/**"
      - ".github/workflows/hassfest.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
